name: Update V Liga

on:
  workflow_dispatch: # run manually
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0
      - name: Run tournament CLI
        run: |
          cd tournamentcli
          ./gradlew run --args="https://app.chesstournament64.com/api/v1/tournaments/6 -o ../torneos/v-liga-gambito-de-guada-grupo-a.md"
          ./gradlew run --args="https://app.chesstournament64.com/api/v1/tournaments/7 -o ../torneos/v-liga-gambito-de-guada-grupo-b.md"
          cd ..
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code torneos/v-liga-gambito-de-guada-grupo-a.md torneos/v-liga-gambito-de-guada-grupo-b.md || echo "changed=true" >> $GITHUB_OUTPUT
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add torneos/v-liga-gambito-de-guada-grupo-a.md torneos/v-liga-gambito-de-guada-grupo-b.md
          git commit -m "Actualiza la V Liga Gambito de Guada desde Chess Tournament 64"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
